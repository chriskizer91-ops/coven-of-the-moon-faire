<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The flight</title>
<style>
  /* The flight between zones (Coven of the Moon Faire): the page inside the flight's own frame. The layout is Skies
     of Aethermoor's flying screen (its demos/game.html) with the port, the title, the shards and the wave counter
     taken out, fewer buttons on a phone, and this game's own colours and letters (dark violet panels, pale gold names).
     Every word shown is put in by src/coven-flight.js from game/flight/flight-data.js: none is written here.
     tools/flight-build.mjs packs this page and the flight's code into game/flight/flight-frame.js. */
  :root {
    color-scheme: dark;
    --night: #0a0b18;
    --panel: rgba(14, 12, 34, 0.7);
    --edge: rgba(214, 222, 255, 0.34);
    --ink: #f0ecff;
    --dim: #b8b4e0;
    --gold: #ffe6a8;
    --warn: #ffb4a0;
    --display: Georgia, 'Times New Roman', serif;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --left: calc(12px + env(safe-area-inset-left, 0px));
    --right: calc(12px + env(safe-area-inset-right, 0px));
    --top: calc(12px + env(safe-area-inset-top, 0px));
    --bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font: 14px/1.35 var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 0.8s; cursor: crosshair; }
  body.ready #stage { opacity: 1; }
  body.locked #stage { cursor: none; }
  body.leaving #stage, body.leaving #hud { opacity: 0; transition: opacity 0.9s; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; }
  .shadow { text-shadow: 0 1px 0 #000, 0 0 10px rgba(0, 0, 0, 0.85); }
  .big { min-height: 48px; padding: 11px 26px; font: 400 21px/1 var(--display); color: #1c1638; background: linear-gradient(#fff0c4, #e2bd67); border: 1px solid #fff7dc; border-radius: 24px; }
  .plain { min-height: 48px; padding: 10px 18px; background: var(--panel); border: 1px solid var(--edge); border-radius: 24px; font-size: 15px; }
  .screen { position: fixed; inset: 0; }
  .screen.dim { background: rgba(6, 5, 16, 0.6); display: grid; place-items: center; z-index: 8; }
  .card { padding: 16px 20px; text-align: center; width: min(92vw, 400px); }
  .card h2 { margin: 0; font: 400 28px/1.1 var(--display); color: var(--gold); }
  .card p { margin: 8px 0 14px; color: var(--ink); font-size: 15px; }
  .choices { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  body:not(.ready) #hud, body.over #hud > :not(#banner) { visibility: hidden; }

  /* top left: the ship, and what is left of her */
  #ship { position: fixed; top: var(--top); left: var(--left); padding: 7px 12px 9px; pointer-events: none; }
  #ship h1 { margin: 0; font: 400 22px/1 var(--display); color: var(--gold); letter-spacing: 0.02em; }
  #ship .cls { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .meter { display: block; width: 100%; height: 5px; border-radius: 3px; background: rgba(214, 222, 255, 0.16); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 50%; background: var(--gold); }
  #health { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; margin: 6px 0 0; font-size: 12px; }
  #health .row { display: contents; }
  #health dt { color: var(--dim); }
  #health .meter { width: 74px; }
  #health .low dt { color: var(--warn); }
  .meter.hull i { background: var(--gold); }
  .meter.sails i { background: #e8e4ff; }
  .meter.crystals i { background: #ff9f45; }
  .meter.surge i { background: #9fe7ff; }
  #row-surge.ready dt { color: #9fe7ff; }
  #readout { margin: 5px 0 0; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* top right: the corner map (tap it to make it big), and the pause button under it */
  #minimap { position: fixed; top: var(--top); right: var(--right); width: clamp(150px, 20vw, 250px); aspect-ratio: 3 / 2; border: 1px solid var(--edge);
    border-radius: 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); background: #081a36; cursor: pointer; }
  #minimap.big { width: min(92vw, calc((100vh - 150px) * 1.5), 900px); left: 50%; right: auto; translate: -50% 0; top: calc(var(--top) + 60px); z-index: 5; }
  #btn-pause { position: fixed; top: calc(var(--top) + clamp(100px, 13.34vw, 167px) + 10px); right: var(--right); width: 46px; height: 46px; padding: 0; border-radius: 23px; font-size: 13px; letter-spacing: 1px; }

  /* top middle: the heading, and which guns will fire */
  #compass { position: fixed; top: var(--top); left: 50%; translate: -50% 0; padding: 4px 13px; font: 400 17px/1.1 var(--display); color: var(--ink); pointer-events: none; white-space: nowrap; }
  #battery { position: fixed; left: 50%; top: calc(var(--top) + 38px); translate: -50% 0; text-align: center; font-size: 13px; pointer-events: none; white-space: nowrap; }
  #battery b { color: var(--gold); font-weight: 400; }
  #battery .meter { width: 110px; margin: 3px auto 0; }
  body:not(.fight) #battery, body:not(.fight) #aim { opacity: 0; }
  #battery, #aim { transition: opacity 0.5s; }

  /* the crosshair: thin, and only shown while raiders are about */
  #aim { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; }
  #aim svg { width: 100%; height: 100%; overflow: visible; transition: transform 0.15s; }
  #aim.locked svg { transform: rotate(45deg) scale(1.15); }
  #aim.locked circle, #aim.locked path { stroke: #ff7a5a; }
  #aim.far { opacity: 0.4; }

  /* words that come and go: the banner, a short note, a warning */
  @keyframes show { 0% { opacity: 0; } 18%, 72% { opacity: 1; } 100% { opacity: 0; } }
  #banner { position: fixed; left: 50%; top: 20%; translate: -50% 0; width: max-content; max-width: 92vw; text-align: center; pointer-events: none; opacity: 0; }
  #banner.on { animation: show 4.4s ease-in-out forwards; }
  #banner.stay { animation: none; opacity: 1; }
  #banner-title { margin: 0; font: 400 clamp(26px, 5.4vw, 46px)/1.05 var(--display); color: var(--gold); letter-spacing: 0.02em; text-shadow: 0 2px 0 #000, 0 0 24px rgba(0, 0, 0, 0.9); }
  #banner-line { margin: 6px 0 0; font-size: clamp(14px, 2.4vw, 18px); color: var(--ink); text-shadow: 0 1px 0 #000, 0 0 12px rgba(0, 0, 0, 0.9); }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 84px); translate: -50% 0; margin: 0; padding: 5px 14px; font-size: 14px; color: var(--warn); pointer-events: none; opacity: 0; white-space: nowrap; }
  #toast.on { animation: show 3s ease-in-out forwards; }
  #warn { position: fixed; left: 50%; top: 27%; translate: -50% 0; margin: 0; padding: 6px 14px; color: var(--warn); font-size: 15px; pointer-events: none; max-width: 92vw; text-align: center; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(170, 20, 10, 0) 50%, rgba(170, 20, 10, 0.6) 100%); }

  /* a tag over each raider, and one over the landing; at the edge of the screen it points the way */
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; display: grid; grid-template-columns: auto auto; gap: 2px 6px; padding: 3px 7px 4px; font-size: 11px; white-space: nowrap;
    background: rgba(48, 10, 14, 0.72); border: 1px solid rgba(255, 110, 90, 0.75); border-radius: 7px; color: var(--ink); will-change: transform; }
  .tag b { font-weight: 400; color: #ffb4a0; }
  .tag .d { color: var(--dim); text-align: right; }
  .tag .meter { grid-column: 1 / -1; width: 66px; height: 3px; margin: 0; }
  .tag .arrow { display: none; position: absolute; left: 50%; top: -15px; margin-left: -6px; width: 12px; text-align: center; color: #ff6a50; font-size: 12px; }
  .tag.edge .arrow { display: block; }
  .tag.edge { opacity: 0.9; }
  .tag.locked { border-color: #ffd36a; box-shadow: 0 0 10px rgba(255, 200, 90, 0.6); }
  .tag.way { background: rgba(20, 16, 44, 0.74); border-color: rgba(255, 230, 168, 0.8); font-size: 13px; padding: 4px 9px 5px; }
  .tag.way b { color: var(--gold); }
  .tag.way .arrow { color: var(--gold); }
  /* on the screen the light itself shows where the landing is, so its tag is only the distance; at the edge it is named */
  .tag.way:not(.edge) { grid-template-columns: auto; background: rgba(20, 16, 44, 0.5); border-color: rgba(255, 230, 168, 0.45); }
  .tag.way:not(.edge) .n { display: none; }
  .tag.way .d { color: var(--gold); }

  /* bottom left: how fast it is drawing, and (on a laptop) the keys */
  #dock { position: fixed; left: var(--left); bottom: var(--bottom); display: grid; gap: 8px; justify-items: start; pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #numbers { padding: 5px 11px; font-size: 12px; color: var(--dim); pointer-events: none; }
  #numbers b { color: var(--ink); font-weight: 400; font-size: 14px; }
  #help { padding: 9px 13px; font-size: 12.5px; max-width: 350px; }
  #help h2 { margin: 0 0 4px; font: 400 18px/1 var(--display); color: var(--gold); }
  #help dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
  #help dt { color: var(--ink); white-space: nowrap; }
  #help dd { margin: 0; color: var(--dim); }
  #help p { margin: 6px 0 0; color: var(--gold); }
  #btn-help { min-height: 44px; min-width: 44px; padding: 8px 14px; }
  #hint { position: fixed; left: 50%; bottom: calc(var(--bottom) + 70px); translate: -50% 0; margin: 0; width: max-content; max-width: 86vw; text-align: center; font-size: 14px; pointer-events: none; transition: opacity 0.8s; }
  #hint.gone { opacity: 0; }

  /* touch: the stick appears under the left thumb; Fire and Surge at the bottom right */
  .touch-only { display: none; }
  body.touch .touch-only { display: flex; }
  body.touch .mouse-only { display: none !important; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(230, 226, 255, 0.45);
    background: rgba(20, 18, 44, 0.3); pointer-events: none; display: grid; place-items: center; }
  #stick i { width: 44px; height: 44px; border-radius: 50%; background: rgba(240, 236, 255, 0.55); box-shadow: 0 0 12px rgba(0, 0, 0, 0.5); }
  #touch-buttons { position: fixed; right: var(--right); bottom: calc(var(--bottom) + 8px); gap: 14px; align-items: flex-end; }
  #btn-fire { width: 86px; height: 86px; border-radius: 50%; border: 2px solid rgba(255, 230, 168, 0.85); background: radial-gradient(circle at 50% 40%, #a33a2a, #5a1a20);
    font: 400 22px/1 var(--display); color: var(--gold); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); touch-action: none; }
  #btn-fire.on { background: radial-gradient(circle at 50% 40%, #ffe6a8, #a35a2a); color: #2a1030; }
  #btn-surge { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #9fe7ff; background: radial-gradient(circle at 50% 40%, #2a5a78, #12233a); color: #dff6ff; font-size: 13px; touch-action: none; }
  #btn-surge:disabled { opacity: 0.45; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 400 22px var(--display); color: var(--dim); transition: opacity 0.6s; text-align: center; padding: 0 24px; }
  body.ready #loading { opacity: 0; }
  #error { position: fixed; inset: auto 16px 16px; padding: 12px; background: #3a0d18; border: 1px solid #ff7a8a; border-radius: 10px; z-index: 9; }

  @media (max-width: 700px) {
    #ship { padding: 6px 10px 8px; }
    #ship h1 { font-size: 19px; }
    #health { font-size: 11px; gap: 2px 6px; }
    #health .meter { width: 52px; }
    #readout { display: none; }
    #compass { font-size: 15px; padding: 4px 10px; }
    #minimap { width: 132px; }
    #btn-pause { top: calc(var(--top) + 98px); }
    #battery { top: auto; bottom: calc(var(--bottom) + 112px); right: var(--right); left: auto; translate: none; text-align: right; }
    #battery .meter { margin-right: 0; }
    #toast { top: calc(var(--top) + 124px); font-size: 13px; }
    #hint { bottom: calc(var(--bottom) + 150px); }
    #banner { top: 23%; }
  }
  @media (max-height: 500px) {
    #banner { top: 15%; }
    #banner-title { font-size: 28px; }
    #banner-line { font-size: 15px; margin-top: 3px; }
    #warn { top: 22%; }
    #toast { top: calc(var(--top) + 44px); }
    #hint { bottom: calc(var(--bottom) + 6px); max-width: calc(100vw - 420px); font-size: 13px; }
    #battery { top: auto; bottom: calc(var(--bottom) + 112px); right: var(--right); left: auto; translate: none; text-align: right; }
    #battery .meter { margin-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #banner.on, #toast.on { animation-duration: 0.01s; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<p id="loading"></p>
<div id="hud">
<section id="ship" class="panel">
  <h1 id="ship-name"></h1>
  <div class="cls" id="ship-cls"></div>
  <dl id="health">
    <div class="row" id="row-hull"><dt id="w-hull"></dt><span class="meter hull"><i id="h-hull"></i></span></div>
    <div class="row" id="row-sails"><dt id="w-sails"></dt><span class="meter sails"><i id="h-sails"></i></span></div>
    <div class="row" id="row-crystals"><dt id="w-crystals"></dt><span class="meter crystals"><i id="h-crystals"></i></span></div>
    <div class="row" id="row-surge"><dt id="w-surge"></dt><span class="meter surge"><i id="h-surge"></i></span></div>
  </dl>
  <p id="readout"></p>
</section>
<div id="compass" class="panel" aria-live="off"><span id="heading"></span></div>
<canvas id="minimap"></canvas>
<button id="btn-pause" class="panel" type="button">❚❚</button>
<div id="tags" aria-hidden="true"></div>
<div id="hurt" aria-hidden="true"></div>
<div id="banner" aria-live="polite"><p id="banner-title"></p><p id="banner-line"></p></div>
<p id="toast" class="panel" aria-live="polite"></p>
<div id="aim" aria-hidden="true"><svg viewBox="-23 -23 46 46">
  <circle r="14" fill="none" stroke="#e8e4ff" stroke-width="1.5" opacity="0.8"/><circle r="1.8" fill="#ffe6a8"/>
  <path d="M-22 0h6M16 0h6M0 -22v6M0 16v6" stroke="#e8e4ff" stroke-width="1.5" opacity="0.8"/></svg></div>
<div id="battery" class="shadow"><b id="battery-name"></b> · <span id="battery-count"></span><span class="meter"><i id="reload-bar"></i></span></div>
<p id="warn" class="panel" hidden></p>
<div id="stick" hidden><i></i></div>
<div id="touch-buttons" class="touch-only"><button id="btn-surge" type="button"></button><button id="btn-fire" type="button"></button></div>
<p id="hint" class="shadow"></p>
<div id="dock">
  <section id="help" class="panel mouse-only" hidden>
    <h2 id="help-title"></h2>
    <dl id="help-keys"></dl>
    <p id="lock-hint"></p>
  </section>
  <button id="btn-help" class="panel mouse-only" type="button"></button>
  <div id="numbers" class="panel"><b id="fps">…</b> <span id="w-fps"></span></div>
</div>
</div>
<section id="paused" class="screen dim" hidden>
  <div class="panel card">
    <h2 id="paused-title"></h2>
    <p id="paused-line"></p>
    <div class="choices"><button id="btn-resume" class="big" type="button"></button><button id="btn-back" class="plain" type="button"></button></div>
  </div>
</section>
<p id="error" hidden></p>
<!--SCRIPT-->
</body>
</html>
