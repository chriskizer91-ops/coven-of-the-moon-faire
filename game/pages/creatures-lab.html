<style>
/* The creatures job's own small page: the six creatures from Aethermoor M7. One list, three buttons; Look is a
   screen of its own with the motions along the bottom. */
html,body{margin:0;min-height:100%;background:#0d0a14;color:#f0ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#lab{box-sizing:border-box;max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px))}
#lab h1{margin:0 0 4px;font:400 26px/1.15 Georgia,"Times New Roman",serif;color:#ffe6a8}
#lab p{margin:0 0 12px;font-size:14.5px;line-height:1.4;color:#cfc8ee}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
#list button{appearance:none;font:inherit;text-align:left;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid rgba(214,222,255,.28);background:rgba(34,28,62,.6);color:#f0ecff;cursor:pointer}
#list button b{display:block;font-size:15px;font-weight:600}
#list button small{display:block;font-size:12.5px;color:#b8b4e0;line-height:1.25}
#list button[aria-pressed="true"]{border-color:#ffe6a8;box-shadow:0 0 0 1px #ffe6a8;background:rgba(70,56,110,.8)}
#bar{position:sticky;bottom:0;margin:16px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(13,10,20,.94);border-top:1px solid rgba(214,222,255,.18);display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.go{appearance:none;min-height:48px;min-width:104px;padding:0 18px;border-radius:24px;border:1px solid rgba(255,230,168,.75);background:rgba(70,56,110,.9);color:#fff3d6;font:600 16px Georgia,serif;cursor:pointer}
#last,#wait{margin:10px 0 0;font-size:14px;color:#d8d4f4;min-height:1.3em}
#viewer{position:fixed;inset:0;background:#120e1c}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#vtop{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#vtop button{pointer-events:auto}
#vname{flex:1;text-align:center;font:400 17px/1.3 Georgia,serif;color:#ffe6a8;text-shadow:0 1px 3px #000;padding-top:12px}
#fps{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top,0px));font-size:12px;color:#b8b4e0;background:rgba(13,10,20,.6);padding:2px 8px;border-radius:10px}
#vbar{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(13,10,20,.85) 40%)}
#moves{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#moves button,#vtop button{appearance:none;flex:0 0 auto;min-height:46px;min-width:46px;padding:0 14px;border-radius:23px;border:1px solid rgba(214,222,255,.4);background:rgba(34,28,62,.85);color:#f0ecff;font:500 15px system-ui,sans-serif;cursor:pointer}
</style>
</head>

  <div id="bar"><button class="go" id="look"></button><button class="go" id="play"></button><button class="go" id="watch"></button></div>
</div>
<div id="viewer" hidden>
  <canvas id="view"></canvas>
  <div id="vtop"><button id="vclose"></button><div id="vname"></div><button id="vturn"></button></div>
  <div id="fps"></div>
  <div id="vbar"><div id="moves"></div></div>
</div>
