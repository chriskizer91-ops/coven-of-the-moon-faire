<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Coven of the Moon Faire: the Grey Hat's ship at the jetty</title>
<style>
/* A small page for looking at the Grey Hat's real ship moored at the jetty's pier (the flight job). The jetty alone, with
   no land round it, no people and no story: Io walks down to the pier's end. Few things on the screen, all at its edges. */
html,body{margin:0;height:100%;background:#0a0b18;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ring{position:absolute;display:none;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(230,226,255,.42);background:rgba(20,18,44,.18);pointer-events:none;z-index:3}
#dot{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:rgba(240,236,255,.5);transform:translate(-50%,-50%);pointer-events:none}
#lamps{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:4;appearance:none;min-height:46px;padding:8px 16px;border-radius:23px;border:1px solid rgba(214,222,255,.45);background:rgba(14,14,36,.62);color:#f0ecff;font:inherit;font-size:15px;cursor:pointer}
#numbers{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;padding:6px 12px;border-radius:14px;background:rgba(10,10,28,.6);color:#e8e6ff;font-size:13px;line-height:1.35;pointer-events:none}
#numbers b{font-size:15px}
#toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;max-width:calc(100% - 260px);padding:8px 16px;border-radius:16px;background:rgba(14,12,34,.72);color:#f4f0ff;font-size:15px;line-height:1.3;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#load{position:fixed;inset:0;z-index:9;display:grid;place-content:center;text-align:center;background:#0a0b18;color:#e8e4ff;font-family:Georgia,"Times New Roman",serif;transition:opacity .6s;padding:0 24px}
#load h1{margin:0 0 6px;font-weight:400;font-size:30px;letter-spacing:.02em}
#load h2{margin:0 0 14px;font-weight:400;font-size:17px;color:#cfc8f2}
#load p{margin:0;font:15px system-ui,sans-serif;color:#b8b4e0}
</style>
</head>
<body>
<div id="world"><canvas id="cv"></canvas><div id="ring"><div id="dot"></div></div>
  <button id="lamps">Lamps home: 0 of 12</button>
  <div id="toast"></div>
  <div id="numbers"><b id="fps">…</b> frames a second<br><span id="more"></span></div></div>
<div id="load"><div><h1>Coven of the Moon Faire</h1><h2>The Grey Hat's ship at the jetty</h2><p id="loadmsg">Loading…</p></div></div>
<script src="../lib/three.r128.min.js"></script>
<script src="../witches/io/meshopt_simplifier.js"></script>
<script src="../witches/io/palette.js"></script>
<script src="../witches/io/io_tex.js"></script>
<script src="../witches/io/io_plus.js"></script>
<script src="../witches/io/witch_levels.js"></script>
<script src="../witches/io/moon-io.js"></script>
<script src="../look/flipbook.js"></script>
<script src="../data/maps-jetty.js"></script>
<script src="../engine/place/core.js"></script>
<script src="../engine/place/cutouts.js"></script>
<script src="../engine/place/extras.js"></script>
<script src="../engine/place/paint.js"></script>
<script src="../engine/place/world.js"></script>
<script src="../engine/place/walker.js"></script>
<script src="../places/jetty.js"></script>
<script src="../places/jetty-trees.js"></script>
<script src="../flight/moored/skiff.js"></script>
<script src="../flight/moored/moored-ship.js"></script>
<script src="../places/jetty-ship-real.js"></script>
<script>
// The Grey Hat's real ship at the jetty, to look at (Coven of the Moon Faire, the flight job, November 23, 2026).
// The button hangs lamps on her hooks, three more at each press, in the order they come home (for looking only: in the
// game the story hangs them, game/people/zone-1.js). With ?test in the address nothing waits and the checks drive it.
(async function () {
  const $ = (id) => document.getElementById(id), place = window.W3D_PLACES.jetty;
  let toastT = 0;
  const toast = (s) => { const t = $('toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 2600); };
  // the Flipbook look takes its colours from a picture: here a small one of the jetty's night colours, made on the spot
  { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
    for (const [t, col] of [[0, '#14122c'], [0.3, '#2a2552'], [0.55, '#4a4478'], [0.75, '#7a5a48'], [0.9, '#c8a060'], [1, '#e8e0f0']]) gr.addColorStop(t, col);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); place.paintingSrc = c.toDataURL('image/png'); }
  try {
    const W = await W3D.walk({
      place, root: $('world'), canvas: $('cv'), ring: $('ring'), dot: $('dot'), toast,
      say: (s) => { $('loadmsg').textContent = s; },
      onStats: (n) => { $('fps').textContent = n.fps; $('more').textContent = Math.round(n.triangles / 1000) + ' thousand triangles · ' + n.calls + ' draw calls'; },
    });
    // lamps for looking at: a glass box and a soft light on each hook
    const T = window.THREE, S = place.ship, lamps = [];
    const soft = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,255,255,0.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(c); })();
    for (const h of S.hooks) { const g = new T.Group(), box = new T.Mesh(new T.BoxGeometry(0.17, 0.25, 0.17), new T.MeshBasicMaterial({ color: 0xffca80 })), halo = new T.Sprite(new T.SpriteMaterial({ map: soft, color: 0xffb060, transparent: true, opacity: 0.7, blending: T.AdditiveBlending, depthWrite: false }));
      halo.scale.set(1.5, 1.5, 1); g.add(box, halo); g.position.set(h[0], h[1], h[2]); g.visible = false; W.P.scene.add(g); lamps.push(g); }
    let home = 0;
    window.__lamps = (n) => { home = Math.max(0, Math.min(lamps.length, n | 0)); lamps.forEach((l, i) => { l.visible = i < home; }); $('lamps').textContent = 'Lamps home: ' + home + ' of ' + lamps.length; return home; };
    $('lamps').addEventListener('click', () => window.__lamps(home >= lamps.length ? 0 : home + 3));
    for (const ev of ['pointerdown', 'touchstart', 'mousedown']) $('lamps').addEventListener(ev, (e) => e.stopPropagation());
    const q = /[?&]lamps=(\d+)/.exec(location.search); if (q) window.__lamps(+q[1]);
    $('load').style.opacity = 0; setTimeout(() => { $('load').style.display = 'none'; }, 700);
    setTimeout(() => toast(W3D.quality === 'high' ? 'W A S D or the arrows walk · drag to look · the ship is at the end of the pier' : 'Drag on the left to walk · drag on the right to look'), 900);
    window.__ready = true;
  } catch (e) { console.error(e); $('loadmsg').textContent = 'Something went wrong: ' + e.message; window.__err = String(e && e.stack || e); }
})();
</script>
</body>
</html>
