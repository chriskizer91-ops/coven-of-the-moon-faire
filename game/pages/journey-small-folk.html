<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small folk standing: Coven of the Moon Faire</title>
<!-- journey-small-folk.html: the journey job's own small page (November 24, 2026), to look at one fault and its fix.
     Anyone made smaller than a witch stood with bent knees and elbows. This page stands the four small people of the
     zones (Pell, Tamsin, Tock, Pim) beside one full-size person (Tobb), each made as the zone pages make them (the same
     body, the same size, the same idle), and draws them after two seconds of standing. Nothing here is part of the game.
       python3 tools/build.py game/pages/journey-small-folk.html -->
<style>
  html, body { margin: 0; height: 100%; background: #2b2633; color: #f3ecdc; font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #names div { position: fixed; transform: translateX(-50%); text-align: center; font-size: 14px; text-shadow: 0 1px 2px #000; }
  #msg { position: fixed; left: 0; right: 0; top: 8px; text-align: center; font-size: 14px; opacity: 0.85; }
</style></head>
<body><canvas id="c"></canvas><div id="names"></div><div id="msg">making the people…</div>
<script src="../lib/three.r128.min.js"></script>
<script src="../witches/io/meshopt_simplifier.js"></script>
<script src="../witches/kore/jester_tex.js"></script>
<script src="../witches/kore/jester_kit.js"></script>
<script src="../witches/kore/lod.js"></script>
<script src="../people/folk/face_plain.js"></script>
<script src="../people/folk/person-kit.js"></script>
<script src="../people/folk/emotes.js"></script>
<script src="../people/folk/npcs.js"></script>
<script src="../people/folk/npc_tex.js"></script>
<script src="../people/folk/npc.js"></script>
<script>
(async function () {
  const T = THREE, $ = (id) => document.getElementById(id);
  // who stands here: the same body and size as in the zone pages (game/people/zone-1.js, zone-2.js, zone-3.js)
  const FOLK = [['Pell', 'farm-lad', 0.72], ['Tamsin', 'farm-lad', 0.72], ['Tock', 'fair-baker-opus', 0.62], ['Pim', 'pie-seller', 0.62], ['Tobb (full size)', 'fair-baker-opus', 1]];
  const GAP = 0.95;
  try {
    const R = new T.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: true }); R.setClearColor(0x2b2633, 1); R.outputEncoding = T.sRGBEncoding; R.setPixelRatio(1);
    const scene = new T.Scene(), cam = new T.PerspectiveCamera(28, 1, 0.1, 60);
    scene.add(new T.AmbientLight(0xffffff, 0.7)); const sun = new T.DirectionalLight(0xffffff, 0.5); sun.position.set(1.5, 3, 5); scene.add(sun);
    const ground = new T.Mesh(new T.PlaneGeometry(30, 6), new T.MeshLambertMaterial({ color: 0x4a4258 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
    const people = [];
    for (let i = 0; i < FOLK.length; i++) {
      const [name, body, size] = FOLK[i], n = await window.MF_NPC.make(body);
      n.root.scale.multiplyScalar(size); n.root.position.set((i - (FOLK.length - 1) / 2) * GAP, 0, 0); scene.add(n.root);
      people.push({ name, size, n });
    }
    for (let k = 0; k < 60; k++) for (const p of people) p.n.update(1 / 30);      // two seconds of standing
    const layout = () => { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h;
      const span = (FOLK.length - 1) * GAP + 1.2, dist = Math.max(span / 2 / Math.tan(cam.fov * Math.PI / 360) / cam.aspect, 2.2 / Math.tan(cam.fov * Math.PI / 360)) * 1.05;
      cam.position.set(0.0, 0.95, dist); cam.lookAt(0, 0.8, 0); cam.updateProjectionMatrix(); R.render(scene, cam);
      $('names').innerHTML = ''; const v = new T.Vector3();
      for (const p of people) { v.set(p.n.root.position.x, -0.02, 0).project(cam); const d = document.createElement('div'); d.style.left = ((v.x + 1) / 2 * w) + 'px'; d.style.top = ((1 - v.y) / 2 * h + 6) + 'px'; d.textContent = p.name; $('names').appendChild(d); } };
    // how bent each one's knees are: hip, knee and ankle in a line is 180 degrees
    const knee = (p) => { const r = p.n.model, b = (n) => r.root.getObjectByName(n) || (r.bones || []).find((q) => q.name === n); const hip = b('thighL') || b('thigh_L') || b('thighl'), kn = b('shinL') || b('shin_L'), an = b('footL') || b('foot_L');
      if (!hip || !kn || !an) return null; const a = new T.Vector3(), k = new T.Vector3(), f = new T.Vector3(); hip.getWorldPosition(a); kn.getWorldPosition(k); an.getWorldPosition(f);
      return Math.round(a.sub(k).angleTo(f.sub(k)) * 180 / Math.PI); };
    layout(); addEventListener('resize', layout);
    window.__folk = people.map((p) => ({ name: p.name, size: p.size, knee: knee(p) }));
    $('msg').textContent = 'The four small folk of the zones, and one full-size person, after two seconds of standing';
    window.__w3d = { step: () => R.render(scene, cam), setIo: () => {}, setCam: () => {} };
    window.__ready = true;
  } catch (e) { console.error(e); $('msg').textContent = 'Something went wrong: ' + e.message; window.__err = String(e && e.stack || e); }
})();
</script></body></html>
